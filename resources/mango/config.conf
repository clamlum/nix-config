source=./device.conf

# ---------- Environment ----------
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORMTHEME,qt5ct
env=WLR_RENDERER,vulkan

# ---------- Layout ----------
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

scroller_default_proportion=0.5
scroller_proportion_preset=0.5,1.0
scroller_focus_center=0
scroller_prefer_center=0
scroller_structs=0

focus_cross_monitor=1

# ---------- Appearance ----------
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0
border_px=1
root_color=0x000001ff
border_color=0x595959ff
focus_color=0x6c8affff
maximized_screen_color=0x6c8affff
urgent_color=0x9b0000ff
drop_color=0x8080a0a0

# ---------- Animations ----------
animations=1

animation_type_open=none
animation_type_close=none

animation_duration_tag=100
tag_animation_direction=0

animation_duration_move=150
animation_duration_focus=0

# ---------- Input ----------
xkb_rules_options=caps:none
numlock_on=1
trackpad_click_method=2
sloppy_focus=1
warp_cursor=1

# ---------- Autostart ----------
exec_once=quickshell
exec_once=easyeffects --gapplication-service
exec_once=swaybg -o DP-2 -i /home/clamt/Pictures/wallpapers/353544.jpg -m fill
exec_once=swaybg -o DP-3 -i /home/clamt/Pictures/wallpapers/353544.jpg -m fill
exec_once=swaybg -o eDP-1 -i /home/clamt/Pictures/wallpapers/353544.jpg -m fill

# ---------- Apps ----------
bind=SUPER,t,spawn,wezterm
bind=SUPER,space,spawn,fuzzel
bind=SUPER+SHIFT,space,spawn_shell,sh ~/nix-config/scripts/fuzzel/fuzzel-edit.sh
bind=SUPER,d,spawn_shell,helium-browser > /dev/null 2>&1
bind=SUPER+SHIFT,e,spawn,nautilus

# ---------- Navigation ----------
bind=SUPER,m,toggleoverview
mousebind=SUPER,btn_extra,toggleoverview
bind=SUPER,q,killclient

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right

bind=SUPER,Down,spawn_shell,$NH_OS_FLAKE/resources/mango/ws.sh down
bind=SUPER,Up,spawn_shell,$NH_OS_FLAKE/resources/mango/ws.sh up

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

axisbind=SUPER,Down,spawn_shell,$NH_OS_FLAKE/resources/mango/ws.sh down
axisbind=SUPER,Up,spawn_shell,$NH_OS_FLAKE/resources/mango/ws.sh up
axisbind=SUPER+SHIFT,Up,focusdir,left
axisbind=SUPER+SHIFT,Down,focusdir,right
axisbind=SUPER+SHIFT+CTRL,Up,focusmon,left
axisbind=SUPER+SHIFT+CTRL,Down,focusmon,right

# ---------- Moving windows ----------
bind=SUPER+ALT,Left,exchange_client,left
bind=SUPER+ALT,Right,exchange_client,right
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right

bind=SUPER+SHIFT,Down,spawn_shell,$NH_OS_FLAKE/resources/mango/ws.sh send-down
bind=SUPER+SHIFT,Up,spawn_shell,$NH_OS_FLAKE/resources/mango/ws.sh send-up

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# ---------- Resizing ----------
bind=SUPER,f,switch_proportion_preset
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,minus,resizewin,-100,+0
bind=SUPER,equal,resizewin,+100,+0
bind=SUPER+SHIFT,minus,resizewin,+0,-100
bind=SUPER+SHIFT,equal,resizewin,+0,+100
bind=SUPER,n,togglefloating

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ---------- Screenshots ----------
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp -b 0f0f0fb0)" - | wl-copy
bind=SUPER,s,spawn_shell,grim -o "$(mmsg get all-clients | jq -r '.clients[] | select(.is_focused) | .monitor')" - | wl-copy

# ---------- Session ----------
bind=SUPER+SHIFT,m,quit
bind=CTRL+ALT,Delete,quit
bind=SUPER+SHIFT,r,reload_config
bind=SUPER,l,spawn_shell,qs ipc call lock activate
bind=SUPER+SHIFT,grave,spawn_shell,qs ipc call bar toggle 2>/dev/null || setsid -f qs

bind=SUPER+SHIFT,h,togglehdr,toggle,DP-1

# ---------- Clipboard / media / brightness ----------
bind=SUPER,c,spawn,wtype -M ctrl -k Insert -m ctrl
bind=SUPER,v,spawn,wtype -M shift -k Insert -m shift

bind=SUPER+CTRL,Left,spawn,playerctl previous
bind=SUPER+CTRL,Right,spawn,playerctl next
bind=SUPER+CTRL,space,spawn,playerctl play-pause
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

bind=SUPER+CTRL,Up,spawn_shell,sh $HOME/nix-config/scripts/volume.sh +
bind=NONE,XF86AudioRaiseVolume,spawn_shell,sh $HOME/nix-config/scripts/volume.sh +
bind=SUPER+CTRL,Down,spawn_shell,sh $HOME/nix-config/scripts/volume.sh -
bind=NONE,XF86AudioLowerVolume,spawn_shell,sh $HOME/nix-config/scripts/volume.sh -
bind=NONE,KP_Subtract,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bind=NONE,XF86KbdBrightnessUp,spawn,brightnessctl --device=kbd_backlight set 10%+
bind=NONE,XF86KbdBrightnessDown,spawn,brightnessctl --device=kbd_backlight set 10%-
